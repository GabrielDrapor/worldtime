<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Time Zones</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#1d2330;--muted:#6b7385;--line:#e3e6ec;
  --night:#eceff4;--night-text:#8a92a3;--day:#fafbfc;--work:#dceaff;--work-text:#1f4f99;
  --accent:#2563eb;--sel:rgba(37,99,235,.13);--sel-border:#2563eb;--now:#e5484d;--home:#fff8e6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--panel:#171b23;--text:#e6e9ef;--muted:#8b93a5;--line:#2a303c;
  --night:#12161d;--night-text:#5f6779;--day:#1b2029;--work:#1d3357;--work-text:#b9d2ff;
  --accent:#5b8cff;--sel:rgba(91,140,255,.18);--sel-border:#7aa2ff;--home:#2a2516;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
h1{font-size:18px;margin:0}
.group{display:flex;gap:6px;align-items:center;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
svg.i{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.selbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.selbar .info{color:var(--muted);margin-right:auto}
.selbar .info b{color:var(--text)}
#task{width:240px}
.board{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr)}
.row{height:64px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.left{border-right:1px solid var(--line)}
.left .row{display:flex;align-items:center;gap:8px;padding:0 12px 0 6px}
.row.home{background:var(--home)}
.acts{display:grid;grid-template-columns:repeat(2,22px);gap:2px}
.acts button{padding:3px;width:22px;height:22px;border-radius:5px;color:var(--muted);border-color:transparent;background:transparent}
.acts button:hover:not(:disabled){border-color:var(--line);color:var(--text)}
.acts button.on{color:var(--accent)}
.off{width:36px;display:flex;justify-content:flex-end;font-weight:700;color:var(--muted);flex:none}
.off svg.i{width:18px;height:18px;color:var(--text)}
.name{flex:1;min-width:0}
.label{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.range{text-align:right;white-space:nowrap;flex:none}
.range .t{font-weight:700;font-size:15px}
.range .d{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
.strips{position:relative;min-width:760px;user-select:none;touch-action:pan-y;cursor:crosshair}
.strip{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));height:100%;padding:9px 0}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--day);border-right:1px solid var(--line);font-size:15px;font-weight:600;line-height:1.1}
.cell:last-child{border-right:0}
.cell small{font-size:10px;font-weight:500;opacity:.8}
.cell.night{background:var(--night);color:var(--night-text)}
.cell.work{background:var(--work);color:var(--work-text)}
.cell.daystart{background:var(--accent);color:#fff}
.cell.daystart small{opacity:1;text-transform:uppercase}
.selection{position:absolute;top:0;bottom:0;background:var(--sel);border:2px solid var(--sel-border);border-radius:6px;pointer-events:none}
.nowline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--now);pointer-events:none;opacity:.8}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.add input{flex:1 1 280px;max-width:480px}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:720px){
  .board{grid-template-columns:minmax(0,200px) minmax(0,1fr)}
  .range{display:none}
  #task{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Team Time Zones</h1>
    <div class="group">
      <button id="prev" title="Previous day">‹</button>
      <input type="date" id="date">
      <button id="next" title="Next day">›</button>
      <button id="today">Today</button>
    </div>
    <div class="group">
      Working hours
      <select id="workStart"></select>–<select id="workEnd"></select>
    </div>
    <div class="group">
      <select id="clock"><option value="24">24-hour</option><option value="12">12-hour</option></select>
    </div>
  </header>

  <div class="panel">
    <div class="selbar">
      <span class="info" id="selInfo"></span>
      <input id="task" placeholder="Title (optional), e.g. Day off / Weekly sync">
      <button class="primary" id="copyText">Copy as text</button>
      <button id="copyLink">Copy share link</button>
      <button id="clearSel">Clear</button>
    </div>
    <div class="board">
      <div class="left" id="left"></div>
      <div class="scroll"><div class="strips" id="strips"></div></div>
    </div>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <input id="tzInput" list="tzList" placeholder="City or time zone, e.g. London, Tokyo, America/New_York">
    <button class="primary" type="submit">Add time zone</button>
  </form>
  <datalist id="tzList"></datalist>
  <div class="hint">Drag across the strips to select a time range (30-minute steps). Click once to select one full hour. The home row is the base time zone: the strips follow its date. Your list is saved in this browser. Use "Copy share link" to send the same view to a teammate.</div>
</div>
<div class="toast" id="toast"></div>

<script id="core">
// ---- Pure time helpers (also loaded by test.mjs) ----
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const fmtCache = {};
function fmt(tz) {
  return fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }));
}
function isValidTz(tz) { try { fmt(tz); return true; } catch { return false; } }
function parts(tz, t) {
  const o = {};
  for (const p of fmt(tz).formatToParts(t)) o[p.type] = p.value;
  const y = +o.year, mo = +o.month, d = +o.day, h = +o.hour % 24, mi = +o.minute;
  return { y, mo, d, h, mi, wd: new Date(Date.UTC(y, mo - 1, d)).getUTCDay() };
}
function offsetMs(tz, t) {
  const p = parts(tz, t);
  return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi) - Math.floor(t / 60000) * 60000;
}
// Instant (ms) of 00:00 on dateStr (YYYY-MM-DD) in tz.
function zonedMidnight(dateStr, tz) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const g = Date.UTC(y, m - 1, d);
  let t = g - offsetMs(tz, g);
  t = g - offsetMs(tz, t);
  return t;
}
function todayIn(tz, now = Date.now()) {
  const p = parts(tz, now);
  return `${p.y}-${pad(p.mo)}-${pad(p.d)}`;
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function fmtTime(p, h24) {
  if (h24) return `${pad(p.h)}:${pad(p.mi)}`;
  return `${p.h % 12 || 12}:${pad(p.mi)}${p.h < 12 ? 'am' : 'pm'}`;
}
function fmtDate(p) { return `${WD[p.wd]}, ${MON[p.mo - 1]} ${p.d}`; }
function rangeParts(tz, a, b, h24) {
  const pa = parts(tz, a), pb = parts(tz, b);
  const same = pa.y === pb.y && pa.mo === pb.mo && pa.d === pb.d;
  return {
    time: `${fmtTime(pa, h24)} – ${fmtTime(pb, h24)}`,
    date: same ? fmtDate(pa) : `${fmtDate(pa)} → ${fmtDate(pb)}`,
    text: same ? `${fmtDate(pa)}, ${fmtTime(pa, h24)} – ${fmtTime(pb, h24)}`
               : `${fmtDate(pa)}, ${fmtTime(pa, h24)} – ${fmtDate(pb)}, ${fmtTime(pb, h24)}`
  };
}
function offsetLabel(diffMs) {
  if (diffMs === 0) return '0';
  const h = diffMs / 3600000;
  const s = Number.isInteger(h) ? String(Math.abs(h)) : Math.abs(h).toFixed(2).replace(/0$/, '');
  return (h > 0 ? '+' : '-') + s;
}
function durationLabel(slots) {
  const h = Math.floor(slots / 2), m = slots % 2 ? 30 : 0;
  return [h ? `${h} hr` : '', m ? '30 min' : ''].filter(Boolean).join(' ');
}
function zoneName(tz) { return tz === 'UTC' ? 'UTC' : tz.split('/').pop().replace(/_/g, ' '); }
</script>

<script>
// English aliases for cities that are not IANA zone names.
const ALIAS = {
  'beijing':'Asia/Shanghai','shenzhen':'Asia/Shanghai','hangzhou':'Asia/Shanghai','china':'Asia/Shanghai',
  'san francisco':'America/Los_Angeles','sf':'America/Los_Angeles','seattle':'America/Los_Angeles','pst':'America/Los_Angeles',
  'boston':'America/New_York','washington':'America/New_York','miami':'America/New_York','est':'America/New_York',
  'austin':'America/Chicago','dallas':'America/Chicago','houston':'America/Chicago','cst':'America/Chicago',
  'india':'Asia/Kolkata','bangalore':'Asia/Kolkata','bengaluru':'Asia/Kolkata','mumbai':'Asia/Kolkata','delhi':'Asia/Kolkata',
  'munich':'Europe/Berlin','frankfurt':'Europe/Berlin','cet':'Europe/Berlin','barcelona':'Europe/Madrid',
  'tel aviv':'Asia/Jerusalem','gmt':'Europe/London','utc':'UTC'
};
const ALL_TZ = (Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : []).concat(['UTC']);
const STORE_KEY = 'team-timezones.v2';
const SLOTS = 48;
const viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

const ICON = {
  home: '<svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>'
};

const state = {
  zones: [...new Set([viewerTz, 'America/Los_Angeles', 'America/New_York', 'Europe/Berlin'])],
  home: 0, h24: true, workStart: 9, workEnd: 18,
  date: null, sel: null, task: ''
};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && Array.isArray(s.zones) && s.zones.length) Object.assign(state, {
      zones: s.zones.filter(isValidTz), home: s.home | 0,
      h24: s.h24 !== false, workStart: s.workStart ?? 9, workEnd: s.workEnd ?? 18
    });
  } catch {}
  // A share link overrides the saved list.
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('z')) {
    const zones = h.get('z').split('|').filter(isValidTz);
    if (zones.length) { state.zones = zones; state.home = Math.min(+h.get('h') || 0, zones.length - 1); }
    if (/^\d{4}-\d{2}-\d{2}$/.test(h.get('d') || '')) state.date = h.get('d');
    const m = /^(\d+)-(\d+)$/.exec(h.get('s') || '');
    if (m && +m[1] < +m[2] && +m[2] <= SLOTS) state.sel = { start: +m[1], end: +m[2] };
    if (h.get('t')) state.task = h.get('t');
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (!state.zones.length) state.zones = [viewerTz];
  if (state.home >= state.zones.length) state.home = 0;
  save();
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      zones: state.zones, home: state.home, h24: state.h24, workStart: state.workStart, workEnd: state.workEnd
    }));
  } catch {}
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const homeTz = () => state.zones[state.home];
const base = () => zonedMidnight(state.date, homeTz());
const slotTime = s => base() + s * 1800000;

function abbr(tz, t) {
  try {
    return new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(t).find(p => p.type === 'timeZoneName').value;
  } catch { return ''; }
}

function render() {
  const b = base(), htz = homeTz(), hOff = offsetMs(htz, b);
  $('date').value = state.date;
  $('clock').value = state.h24 ? '24' : '12';
  $('workStart').value = state.workStart; $('workEnd').value = state.workEnd;
  $('task').value = state.task;

  let left = '', right = '';
  state.zones.forEach((tz, i) => {
    const isHome = i === state.home;
    let range;
    if (state.sel) {
      const r = rangeParts(tz, slotTime(state.sel.start), slotTime(state.sel.end), state.h24);
      range = `<div class="range"><div class="t">${r.time}</div><div class="d">${r.date}</div></div>`;
    } else {
      const p = parts(tz, Date.now());
      range = `<div class="range"><div class="t">${fmtTime(p, state.h24)}</div><div class="d">Now · ${fmtDate(p)}</div></div>`;
    }
    left += `<div class="row${isHome ? ' home' : ''}" data-i="${i}">
      <div class="acts">
        <button data-act="del" title="Remove"${state.zones.length < 2 ? ' disabled' : ''}>${ICON.x}</button>
        <button data-act="up" title="Move up"${i === 0 ? ' disabled' : ''}>${ICON.up}</button>
        <button data-act="home" title="Set as home time zone"${isHome ? ' class="on"' : ''}>${ICON.home}</button>
        <button data-act="down" title="Move down"${i === state.zones.length - 1 ? ' disabled' : ''}>${ICON.down}</button>
      </div>
      <div class="off" title="${isHome ? 'Home time zone' : 'Hours from home time zone'}">${isHome ? ICON.home : offsetLabel(offsetMs(tz, b) - hOff)}</div>
      <div class="name"><div class="label">${esc(zoneName(tz))}</div>
        <div class="sub">${esc(abbr(tz, b))} · ${esc(tz)}</div></div>
      ${range}
    </div>`;

    let cells = '', prevKey = null;
    for (let c = 0; c < 24; c++) {
      const p = parts(tz, b + c * 3600000);
      const key = `${p.y}-${p.mo}-${p.d}`;
      const dayStart = prevKey !== null ? key !== prevKey : (p.h === 0 && p.mi === 0);
      prevKey = key;
      if (dayStart) {
        cells += `<div class="cell daystart" title="${fmtDate(p)}"><small>${MON[p.mo - 1]}</small>${p.d}</div>`;
        continue;
      }
      const cls = p.h >= state.workStart && p.h < state.workEnd ? 'work' : (p.h < 7 || p.h >= 22 ? 'night' : '');
      const hour = state.h24 ? p.h : (p.h % 12 || 12);
      const sub = [p.mi ? ':' + pad(p.mi) : '', state.h24 ? '' : (p.h < 12 ? 'am' : 'pm')].filter(Boolean).join(' ');
      cells += `<div class="cell ${cls}">${hour}${sub ? `<small>${sub}</small>` : ''}</div>`;
    }
    right += `<div class="row${isHome ? ' home' : ''}"><div class="strip">${cells}</div></div>`;
  });

  const now = Date.now();
  if (now >= b && now < b + 86400000) right += `<div class="nowline" style="left:${(now - b) / 864000}%" title="Now"></div>`;
  if (state.sel) right += `<div class="selection" style="left:${state.sel.start / SLOTS * 100}%;width:${(state.sel.end - state.sel.start) / SLOTS * 100}%"></div>`;

  $('left').innerHTML = left;
  $('strips').innerHTML = right;

  $('selInfo').innerHTML = state.sel
    ? `Selected: <b>${durationLabel(state.sel.end - state.sel.start)}</b>`
    : 'Drag across the strips below to select a time range';
  ['copyText', 'clearSel'].forEach(id => $(id).disabled = !state.sel);
}

// ---- Selection by drag ----
let drag = null;
function slotAt(e) {
  const r = $('strips').getBoundingClientRect();
  return Math.max(0, Math.min(SLOTS - 1, Math.floor((e.clientX - r.left) / r.width * SLOTS)));
}
$('strips').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const s = slotAt(e);
  drag = { anchor: s, moved: false, id: e.pointerId };
  $('strips').setPointerCapture(e.pointerId);
  state.sel = { start: s, end: s + 1 };
  render();
});
$('strips').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const s = slotAt(e);
  if (s !== drag.anchor) drag.moved = true;
  const sel = { start: Math.min(drag.anchor, s), end: Math.max(drag.anchor, s) + 1 };
  if (!state.sel || sel.start !== state.sel.start || sel.end !== state.sel.end) { state.sel = sel; render(); }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved) { const h = Math.floor(drag.anchor / 2) * 2; state.sel = { start: h, end: h + 2 }; render(); }
  drag = null;
}
$('strips').addEventListener('pointerup', endDrag);
$('strips').addEventListener('pointercancel', endDrag);

// ---- Row actions ----
$('left').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const i = +btn.closest('.row').dataset.i, z = state.zones;
  const homeZone = z[state.home];
  if (btn.dataset.act === 'del') { z.splice(i, 1); }
  else if (btn.dataset.act === 'up') { [z[i - 1], z[i]] = [z[i], z[i - 1]]; }
  else if (btn.dataset.act === 'down') { [z[i + 1], z[i]] = [z[i], z[i + 1]]; }
  else if (btn.dataset.act === 'home') {
    // Keep the same selected instants when switching the base zone, if they still fit the new day.
    const sel = state.sel && [slotTime(state.sel.start), slotTime(state.sel.end)];
    state.home = i;
    state.date = todayIn(z[i], sel ? sel[0] : Date.now());
    if (sel) {
      const s = Math.round((sel[0] - base()) / 1800000), en = Math.round((sel[1] - base()) / 1800000);
      state.sel = s >= 0 && en <= SLOTS ? { start: s, end: en } : null;
    }
    save(); render(); return;
  }
  const hi = z.indexOf(homeZone);
  state.home = hi < 0 ? 0 : hi;
  save(); render();
});

// ---- Header controls ----
for (let h = 0; h <= 24; h++) {
  const o = `<option value="${h}">${h}:00</option>`;
  if (h < 24) $('workStart').insertAdjacentHTML('beforeend', o);
  if (h > 0) $('workEnd').insertAdjacentHTML('beforeend', o);
}
$('workStart').onchange = e => { state.workStart = +e.target.value; save(); render(); };
$('workEnd').onchange = e => { state.workEnd = +e.target.value; save(); render(); };
$('clock').onchange = e => { state.h24 = e.target.value === '24'; save(); render(); };
$('date').onchange = e => { if (e.target.value) { state.date = e.target.value; render(); } };
$('prev').onclick = () => { state.date = addDays(state.date, -1); render(); };
$('next').onclick = () => { state.date = addDays(state.date, 1); render(); };
$('today').onclick = () => { state.date = todayIn(homeTz()); render(); };
$('task').oninput = e => { state.task = e.target.value; };
$('clearSel').onclick = () => { state.sel = null; render(); };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(msg);
}
$('copyText').onclick = () => {
  if (!state.sel) return;
  const a = slotTime(state.sel.start), b = slotTime(state.sel.end);
  const head = `${state.task.trim() || 'Time'} (${durationLabel(state.sel.end - state.sel.start)})`;
  const lines = state.zones.map(tz => `${zoneName(tz)}: ${rangeParts(tz, a, b, state.h24).text}`);
  copy([head, ...lines].join('\n'), 'Copied as text');
};
$('copyLink').onclick = () => {
  const p = new URLSearchParams();
  p.set('z', state.zones.join('|'));
  p.set('h', state.home); p.set('d', state.date);
  if (state.sel) p.set('s', `${state.sel.start}-${state.sel.end}`);
  if (state.task.trim()) p.set('t', state.task.trim());
  const url = location.href.split('#')[0] + '#' + p.toString();
  copy(url, location.protocol === 'file:' ? 'Copied (local file link: only works where the same file exists)' : 'Copied share link');
};

// ---- Add zone ----
$('tzList').innerHTML = ALL_TZ.map(t => `<option value="${t}"></option>`).join('');
function resolveTz(input) {
  const s = input.trim().toLowerCase();
  if (!s) return null;
  if (ALIAS[s]) return ALIAS[s];
  const exact = ALL_TZ.find(t => t.toLowerCase() === s);
  if (exact) return exact;
  const key = s.replace(/\s+/g, '_');
  const byCity = ALL_TZ.find(t => t.toLowerCase().split('/').pop() === key);
  if (byCity) return byCity;
  return isValidTz(input.trim()) ? input.trim() : null;
}
$('addForm').onsubmit = e => {
  e.preventDefault();
  const tz = resolveTz($('tzInput').value);
  if (!tz) { toast('Time zone not found. Try a city name or Area/City.'); return; }
  if (state.zones.includes(tz)) { toast(`${zoneName(tz)} is already in the list`); return; }
  state.zones.push(tz);
  $('tzInput').value = '';
  save(); render();
};

load();
if (!state.date) state.date = todayIn(homeTz());
render();
setInterval(() => { if (!drag) render(); }, 60000);
</script>
</body>
